name: Linux Build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/linux-build

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Linux Anon runtime
        run: |
          echo "Linux SDK runtime files:"
          ls -lah node_modules/@anyone-protocol/anyone-client/bin/linux/x64

          test -f node_modules/@anyone-protocol/anyone-client/bin/linux/x64/anon || {
            echo "anon binary was not downloaded by the SDK postinstall"
            exit 1
          }

      - name: Build Linux x64
        run: npm run build:linux -- --publish never

      - name: Show build output
        run: find dist -maxdepth 2 -type f -printf '%p %k KB\n' | sort

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: AnyoneVPN-1.0.7-beta-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
